name: probe
on:
  push:
    paths: ["probe/probe.py"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out; git commit -m "probe" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
